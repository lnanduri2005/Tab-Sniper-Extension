<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pause countdown · Tab Sniper</title>
    <link rel="stylesheet" href="ui/tokens.css">
    <link rel="stylesheet" href="ui/base.css">
    <link rel="stylesheet" href="ui/mascot.css">
    <link rel="stylesheet" href="page.css">
</head>
<body>
    <main class="stage-page">
        <p class="bubble big" id="bubble" aria-live="polite"></p>
        <div class="hero-mascot" id="mascot-slot"></div>
        <h1 class="domain-title" id="title"></h1>
        <div class="big-clock" id="countdown" role="timer">--:--</div>
        <p class="detail" id="detail">Stay on this tab. Switching away or minimizing restarts the countdown.</p>
        <p class="message" id="message" aria-live="polite"></p>
        <div class="actions"><button class="btn ghost" id="cancel">Never mind</button></div>
    </main>
    <script type="module" src="pause.js"></script>
</body>
</html>
