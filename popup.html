<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab Sniper</title>
    <link rel="stylesheet" href="ui/tokens.css">
    <link rel="stylesheet" href="ui/base.css">
    <link rel="stylesheet" href="ui/mascot.css">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="window popup">
        <div class="titlebar">
            <div class="dots" aria-hidden="true"><span class="dot pink"></span><span class="dot slate"></span></div>
            <span class="zzz" aria-hidden="true">z<span>Z</span>z</span>
            <div class="tabs" role="tablist" aria-label="Tab Sniper">
                <button class="tab" role="tab" id="tab-home" aria-controls="panel-home" aria-selected="true">Home</button>
                <button class="tab" role="tab" id="tab-focus" aria-controls="panel-focus" aria-selected="false">Focus</button>
                <button class="tab" role="tab" id="tab-sites" aria-controls="panel-sites" aria-selected="false">Sites</button>
            </div>
            <button class="title-btn" id="dashboard-btn" title="Open dashboard" aria-label="Open dashboard"></button>
        </div>

        <div class="screen">
            <div class="stage" id="stage">
                <div class="face-slot" id="face-slot"></div>
                <p class="line" id="line" aria-live="polite"></p>
            </div>

            <section class="panel" id="panel-home" role="tabpanel" aria-labelledby="tab-home">
                <button class="btn block wake" id="wake-btn"></button>

                <div class="here" id="here" hidden>
                    <div class="here-head">
                        <span class="muted small">This tab</span>
                        <strong class="here-domain" id="here-domain"></strong>
                        <span id="here-status"></span>
                    </div>
                    <div class="here-actions" id="here-actions">
                        <button class="btn small cream" data-tier="ban">Ban</button>
                        <button class="btn small slate" data-tier="watched">Watch</button>
                        <button class="btn small" data-tier="super">Super ban</button>
                    </div>
                </div>

                <h2 class="section-title">Today</h2>
                <ul class="rows" id="today"></ul>
            </section>

            <section class="panel" id="panel-focus" role="tabpanel" aria-labelledby="tab-focus" hidden>
                <div class="clock" id="clock">25:00</div>
                <div class="strip" aria-hidden="true"><div class="strip-fill" id="strip-fill"></div></div>

                <div id="focus-setup">
                    <div class="chips" id="duration-chips" role="radiogroup" aria-label="Focus length"></div>
                    <div class="custom-row">
                        <label for="custom-minutes" class="muted small">Custom</label>
                        <input class="field" type="number" id="custom-minutes" min="1" max="240" value="25">
                        <span class="muted small">min</span>
                        <button class="btn small ghost" id="save-preset">Save as preset</button>
                    </div>
                    <button class="btn block" id="start-focus"></button>
                    <p class="hint muted small">Bans stay on until the timer ends.</p>
                </div>

                <div id="focus-running" hidden>
                    <button class="btn block ghost" id="end-early"></button>
                    <p class="hint muted small">Ending early takes a short challenge.</p>
                </div>
                <p class="message" id="focus-message"></p>
            </section>

            <section class="panel" id="panel-sites" role="tabpanel" aria-labelledby="tab-sites" hidden>
                <form class="add" id="add-form">
                    <input class="field" id="add-input" placeholder="reddit.com" aria-label="Website" autocomplete="off">
                    <div class="seg" role="radiogroup" aria-label="Type">
                        <label><input type="radio" name="tier" value="ban" checked><span>Ban</span></label>
                        <label><input type="radio" name="tier" value="watched"><span>Watch</span></label>
                        <label><input type="radio" name="tier" value="super"><span>Super</span></label>
                    </div>
                    <button class="btn small" type="submit" id="add-btn">Add</button>
                </form>
                <p class="message" id="sites-message"></p>
                <div id="site-groups"></div>
                <button class="link-btn" id="manage-btn">Manage everything in the dashboard</button>
            </section>
        </div>
    </div>
    <script type="module" src="popup.js"></script>
</body>
</html>
